name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  schedule:
    - cron: "23 3 * * 1"

jobs:
  cross-platform:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install development dependencies
        run: python -m pip install ".[dev]"
      - name: Run regression suite
        run: python tests/run_tests.py
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
      - name: Run unified pytest suite with coverage
        run: python -m pytest --cov=tokenplan_setup --cov-report=term-missing
      - name: Ruff
        run: python -m ruff check .
      - name: Mypy
        run: python -m mypy
      - name: Import architecture
        run: lint-imports
      - name: Check deterministic artifacts
        run: python scripts/build_dist.py --check
      - name: Smoke Python module
        run: python -m tokenplan_setup --version
      - name: Smoke npm wrapper
        run: node npm/bin/tokenplan-setup.js --version
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"

  official-model-docs:
    name: Weekly official model documentation check
    if: github.event_name == 'schedule'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare catalog with official documentation
        run: python scripts/check_models.py

  # 精确版本 pin 防不住同一版本号下 tarball 被重新发布,只有和 registry 实时
  # 比对 integrity 才能发现。这个 job 故意不设 continue-on-error:偶发的网络
  # 误报可以接受,静默的供应链漂移不行。
  supply-chain-pins:
    name: Weekly npm version and integrity verification
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify pinned versions against npm registry
        run: python scripts/check_tool_versions.py
